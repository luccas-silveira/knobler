name: Knobler
options:
  deploymentTarget:
    macOS: "14.2"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.12.4
targets:
  Knobler:
    type: application
    platform: macOS
    sources:
      # Includes AgentRequestModels.swift and AgentRequestStore.swift.
      - Knobler
      # script que o MediaRemoteSource roda via /usr/bin/perl (now playing universal)
      - path: Vendor/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - sdk: Collaboration.framework
      # carregado pelo perl, não pelo app — embed sem link (ver Vendor/PROVENANCE.md)
      - framework: Vendor/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
    scheme: {}
    info:
      path: Knobler/Info.plist
      properties:
        CFBundleName: Knobler
        CFBundleDisplayName: Knobler
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSAudioCaptureUsageDescription: Knobler lê o áudio do player para animar o visualizador no notch, como no iPhone.
        # Obrigatória: o BluetoothMonitor chama registerForConnectNotifications, e
        # sem a chave o TCC aborta o processo no primeiro pedido (só não aparece
        # em máquina que já concedeu antes).
        NSBluetoothAlwaysUsageDescription: Knobler detecta seus AirPods pra mostrar a bateria e o card de conexão no notch.
        NSCalendarsFullAccessUsageDescription: Knobler mostra a contagem regressiva do próximo evento no notch.
        NSCameraUsageDescription: Knobler mostra sua câmera no notch como espelho antes de reuniões.
        NSMicrophoneUsageDescription: Knobler grava sua voz enquanto você segura a tecla de ditado, para transcrever onde o cursor estiver.
        NSLocalNetworkUsageDescription: Knobler troca mensagens com outros Macs na sua rede local.
        NSBonjourServices:
          - _knobler._tcp
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoi.knobler
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Knobler/Knobler-Bridging-Header.h
        # Espelha a última release. NÃO editar à mão — o tools/release.sh é o
        # único escritor (ver VERSIONING.md). Build de release sobrescreve via
        # override na linha de comando do xcodebuild.
        MARKETING_VERSION: "0.22.0"
        CURRENT_PROJECT_VERSION: "0.22.0"
        # MESMA identidade que o tools/release.sh usa. O TCC ancora a permissão
        # de Acessibilidade no csreq da assinatura: se um build do xcodebuild
        # (outra identidade) for copiado por cima de uma instalação vinda do
        # release.sh, a permissão é invalidada e o ditado morre em silêncio.
        # Criada uma vez por tools/make-signing-cert.sh; a CI não precisa dela
        # (builda com CODE_SIGNING_ALLOWED=NO).
        CODE_SIGN_IDENTITY: "Knobler Local Signing"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: "NO"
