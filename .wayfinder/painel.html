<!doctype html>
<meta charset="utf-8">
<title>Wayfinder — acompanhamento</title>
<!-- Servir com: ./.wayfinder/painel.sh  (python3 -m http.server em .wayfinder/) -->
<script src="marked.min.js"></script>
<style>
  :root { color-scheme: light dark; --linha: color-mix(in srgb, currentColor 15%, transparent); }
  body { font: 15px/1.6 -apple-system, system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1.5rem; }
  h1 { font-size: 1.6rem; margin-bottom: .2rem }
  .sub { opacity: .6; margin-top: 0 }
  .barra { height: 8px; border-radius: 4px; background: var(--linha); overflow: hidden; margin: 1rem 0 .3rem }
  .barra > i { display: block; height: 100%; background: seagreen }
  .grupo { margin-top: 2rem }
  .grupo > h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; opacity: .55 }
  details { border-top: 1px solid var(--linha); padding: .6rem 0 }
  summary { cursor: pointer; display: flex; gap: .6rem; align-items: baseline }
  summary::-webkit-details-marker { display: none }
  .id { opacity: .4; font-variant-numeric: tabular-nums; font-size: .85em }
  .tag { font-size: .72em; padding: .1em .5em; border-radius: 999px; border: 1px solid var(--linha); opacity: .7 }
  .espera { font-size: .8em; opacity: .55; margin-left: auto }
  .corpo { padding: .4rem 0 1rem 2.2rem; }
  .corpo table { border-collapse: collapse; font-size: .9em }
  .corpo td, .corpo th { border: 1px solid var(--linha); padding: .25rem .6rem; text-align: left }
  .corpo pre { background: var(--linha); padding: .6rem; border-radius: 6px; overflow-x: auto }
  .fechado summary { opacity: .5 }
  #mapa { border-top: 1px solid var(--linha); margin-top: 3rem; padding-top: 1rem }
  #mapa h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; opacity: .55 }
</style>

<h1 id="titulo">carregando…</h1>
<p class="sub" id="destino"></p>
<div class="barra"><i id="preenche" style="width:0"></i></div>
<p class="sub" id="contagem"></p>

<div id="grupos"></div>

<details id="mapa"><summary><h2 style="display:inline">O mapa inteiro</h2></summary><div class="corpo" id="mapaCorpo"></div></details>

<script>
const DIR = new URLSearchParams(location.search).get('m') || 'marketplace';

const campo = (txt, nome) => (txt.match(new RegExp('^- ' + nome + ':\\s*(.*)$', 'm')) || [, ''])[1].trim();

async function listarTickets() {
  // http.server devolve listagem HTML; os .md estão nos hrefs.
  const html = await (await fetch(`${DIR}/tickets/`)).text();
  return [...html.matchAll(/href="([^"]+\.md)"/g)].map(m => decodeURIComponent(m[1])).sort();
}

async function carregar() {
  const [mapa, arquivos] = await Promise.all([
    fetch(`${DIR}/map.md`).then(r => r.text()),
    listarTickets(),
  ]);

  document.getElementById('titulo').textContent = mapa.match(/^# (.*)$/m)[1];
  document.getElementById('destino').textContent =
    (mapa.split('## Destination')[1] || '').split('##')[0].trim().split('\n\n')[0]
      .replace(/\n/g, ' ').replace(/\*\*|`/g, '');
  document.getElementById('mapaCorpo').innerHTML = marked.parse(mapa);

  const tickets = await Promise.all(arquivos.map(async nome => {
    const txt = await (await fetch(`${DIR}/tickets/${nome}`)).text();
    const bloqueio = campo(txt, 'blocked-by');
    return {
      nome,
      id: nome.slice(0, 3),
      titulo: txt.match(/^# (.*)$/m)[1],
      tipo: campo(txt, 'label').replace('wayfinder:', ''),
      fechado: campo(txt, 'status') === 'closed',
      dono: campo(txt, 'assignee').replace(/^—$/, ''),
      espera: [...bloqueio.matchAll(/\b(\d{3})\b/g)].map(m => m[1]),
      corpo: txt,
    };
  }));

  const fechados = new Set(tickets.filter(t => t.fechado).map(t => t.id));
  const pendente = t => t.espera.filter(id => !fechados.has(id));

  const grupos = [
    ['Dá pra pegar agora', tickets.filter(t => !t.fechado && !pendente(t).length && !t.dono)],
    ['Em andamento', tickets.filter(t => !t.fechado && t.dono)],
    ['Esperando outro ticket', tickets.filter(t => !t.fechado && pendente(t).length && !t.dono)],
    ['Fechados', tickets.filter(t => t.fechado)],
  ];

  document.getElementById('preenche').style.width = `${100 * fechados.size / tickets.length}%`;
  document.getElementById('contagem').textContent =
    `${fechados.size} de ${tickets.length} fechados · ${grupos[0][1].length} prontos pra pegar`;

  document.getElementById('grupos').innerHTML = grupos.filter(([, ts]) => ts.length).map(([nome, ts]) => `
    <section class="grupo"><h2>${nome} (${ts.length})</h2>${ts.map(t => `
      <details class="${t.fechado ? 'fechado' : ''}">
        <summary>
          <span class="id">${t.id}</span>
          <strong>${t.titulo}</strong>
          <span class="tag">${t.tipo}</span>
          ${pendente(t).length ? `<span class="espera">espera ${pendente(t).join(', ')}</span>` : ''}
          ${t.dono ? `<span class="espera">com ${t.dono}</span>` : ''}
        </summary>
        <div class="corpo">${marked.parse(t.corpo.replace(/^# .*$/m, ''))}</div>
      </details>`).join('')}</section>`).join('');
}

carregar().catch(e => {
  document.getElementById('titulo').textContent = 'não carregou';
  document.getElementById('destino').textContent = e.message + ' — a página precisa ser servida por ./.wayfinder/painel.sh, não aberta como arquivo.';
});
</script>
